apiVersion: batch/v1
kind: Job
metadata:
  name: nai-apply-resources-2.5.0
  namespace: ${workspaceNamespace}
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: null
  template:
    spec:
      serviceAccountName: nai-postinstall
      restartPolicy: OnFailure
      containers:
        - name: apply-resources
          image: bitnamilegacy/kubectl:1.30.5
          imagePullPolicy: IfNotPresent
          env:
            - name: WORKSPACE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBECONFIG
              value: /opt/bitnami/kubectl/.kube/config
            - name: MAX_RETRIES
              value: "5"
            - name: RETRY_DELAY
              value: "10"
            - name: TARGET_NAMESPACE
              value: "nai-system"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Starting NAI resources application..."
              echo ""

              # Function to apply resource with retry logic
              apply_resource() {
                local RESOURCE_NAME=$1
                local RESOURCE_FILE=$2
                local RESOURCE_TYPE=$3
                local RESOURCE_K8S_NAME=$4
                
                echo "=========================================="
                echo "Applying $RESOURCE_NAME"
                echo "=========================================="
                
                RETRY_COUNT=0
                SUCCESS=false

                while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                  ATTEMPT=$((RETRY_COUNT + 1))
                  echo "Attempt $ATTEMPT of $MAX_RETRIES for $RESOURCE_NAME..."
                  
                  if kubectl apply -f "$RESOURCE_FILE"; then
                    echo "✅ $RESOURCE_NAME applied successfully on attempt $ATTEMPT!"
                    SUCCESS=true
                    
                    # Verify the resource was created
                    echo "Verifying $RESOURCE_NAME creation..."
                    if kubectl get "$RESOURCE_TYPE" "$RESOURCE_K8S_NAME" -n "$TARGET_NAMESPACE" 2>/dev/null; then
                      echo "✅ $RESOURCE_NAME resource confirmed in cluster"
                    fi
                    echo ""
                    break
                  else
                    RETRY_COUNT=$((RETRY_COUNT + 1))
                    if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                      echo "⚠️ Failed to apply $RESOURCE_NAME."
                      echo "   Retrying in ${RETRY_DELAY} seconds..."
                      echo ""
                      sleep $RETRY_DELAY
                    fi
                  fi
                done

                if [ "$SUCCESS" = false ]; then
                  echo "❌ FAILED: Could not apply $RESOURCE_NAME after $MAX_RETRIES attempts"
                  return 1
                fi
                
                return 0
              }

              # Certificate manifest
              cat <<'EOF' > /tmp/nai-self-signed-cert.yaml
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: nai-ingressgateway-selfsigned-certificate
                namespace: nai-system
              spec:
                secretName: ingress-certificate
                commonName: nai.example.com
                issuerRef:
                  name: selfsigned-issuer
                  kind: ClusterIssuer
                  group: cert-manager.io
                dnsNames:
                - nai.example.com
              EOF

              # ServiceMonitor manifest
              cat <<EOF > /tmp/nai-node-exporter-monitor.yaml
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                annotations:
                  meta.helm.sh/release-name: nai-core
                  meta.helm.sh/release-namespace: nai-system
                labels:
                  app.kubernetes.io/instance: nutanix-ai
                  app.kubernetes.io/managed-by: Helm
                  app.kubernetes.io/name: nai-iep
                  app.kubernetes.io/part-of: nai-core
                  helm.sh/chart: nai-core-2.5.0
                  prometheus: nai
                name: nai-node-exporter-monitor
                namespace: nai-system
              spec:
                attachMetadata:
                  node: false
                endpoints:
                - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                  port: http-metrics
                  relabelings:
                  - action: replace
                    regex: (.*)
                    replacement: \$1
                    sourceLabels:
                    - __meta_kubernetes_pod_node_name
                    targetLabel: node
                  scheme: https
                  tlsConfig:
                    insecureSkipVerify: true
                jobLabel: jobLabel
                namespaceSelector:
                  matchNames:
                  - $WORKSPACE_NAMESPACE
                selector:
                  matchLabels:
                    app.kubernetes.io/instance: kube-prometheus-stack
                    app.kubernetes.io/name: prometheus-node-exporter
              EOF

              # Track overall success
              OVERALL_SUCCESS=true

              # Apply Certificate
              if ! apply_resource "Certificate" "/tmp/nai-self-signed-cert.yaml" "certificate" "nai-ingressgateway-selfsigned-certificate"; then
                OVERALL_SUCCESS=false
              fi

              # Apply ServiceMonitor
              if ! apply_resource "ServiceMonitor" "/tmp/nai-node-exporter-monitor.yaml" "servicemonitor" "nai-node-exporter-monitor"; then
                OVERALL_SUCCESS=false
              fi

              # Final status
              echo "=========================================="
              if [ "$OVERALL_SUCCESS" = true ]; then
                echo "✅ SUCCESS"
                echo "=========================================="
                echo "All resources applied successfully"
                exit 0
              else
                echo "❌ FAILED"
                echo "=========================================="
                echo "Some resources failed to apply"
                exit 1
              fi

