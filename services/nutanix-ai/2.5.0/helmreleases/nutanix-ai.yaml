---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nutanix-ai
  namespace: ${workspaceNamespace}
spec:
  dependsOn:
    - name: kserve
      namespace: ${workspaceNamespace}
    - name: kserve-crd
      namespace: ${workspaceNamespace}
    - name: nutanix-ai-operators
      namespace: ${workspaceNamespace}
    - name: opentelemetry-operator
      namespace: ${workspaceNamespace}
    - name: envoy-gateway
      namespace: ${workspaceNamespace}
  chart:
    spec:
      chart: nai-core
      sourceRef:
        kind: HelmRepository
        name: nutanix.github.io-helm-releases
        namespace: ${workspaceNamespace}
      version: 0.1.0+build.2422
  interval: 15s
  install:
    timeout: 15m
    remediation:
      retries: 30
    createNamespace: true
  upgrade:
    timeout: 15m
    remediation:
      retries: 30
  uninstall:
    timeout: 15m
  releaseName: nutanix-ai
  valuesFrom:
    - kind: ConfigMap
      name: nutanix-ai-2.5.0-nkp-defaults
    - kind: ConfigMap
      name: service-monitor-defaults
  targetNamespace: nai-system
