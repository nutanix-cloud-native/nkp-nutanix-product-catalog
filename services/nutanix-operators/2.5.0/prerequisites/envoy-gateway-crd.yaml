---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: envoy-gateway-crds
  namespace: ${workspaceNamespace}
spec:
  interval: 10m
  url: oci://docker.io/envoyproxy/gateway-crds-helm
  ref:
    tag: v1.5.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
  namespace: ${workspaceNamespace}
spec:
  interval: 15s
  releaseName: envoy-gateway-crds
  chartRef:
    kind: OCIRepository
    name: envoy-gateway-crds
  install:
    disableWait: true
    remediation:
      retries: 3
    crds: CreateReplace
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
    crds: CreateReplace
  storageNamespace: ${workspaceNamespace}
  driftDetection:
    mode: disabled
  values:
    crds:
      gatewayAPI:
        enabled: true
      envoyGateway:
        enabled: true