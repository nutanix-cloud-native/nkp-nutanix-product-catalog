overview: |-
  # Overview
  Nutanix Data Services for Kubernetes (NDK) simplifies and unifies the life cycle management of business-critical applications by extending enterprise data services to containerized applications.
  ## For Information on Features
  - [Nutanix Data Services for Kubernetes](https://portal.nutanix.com/page/documents/details?targetId=Nutanix-Data-Services-for-Kubernetes-v1_3)
  
  ## Prerequisites and Configuration Guide
  ### Before you begin, ensure that you have a workload cluster running Kubernetes version >= 1.26.0 and CSI version 3.0 installed.
  ### Nutanix Data Services for Kubernetes 1.3.0 requires the following applications to be installed on the cluster:
  - cert-manager v1.13.0

  ### By default, NDK will be configured to use a self-signed certificates orchestrated by default cert-manager. However you can configure NDK to use certificates issued by a custom Issuer or you can use certifiactes backed by a custom secret. Following are the steps to configure NDK to use certificates issued by a custom Issuer:
  ### For using a custom issuer (issuer should already be created in the namespace "ntnx-system", and it's reference should be provided as mentioned below)
  ```
  tls:
    webhook:
      mode: "ISSUER"
      issuer:
        issuerName: <issuer-name>
    server:
      mode: "ISSUER"
      issuer:
        issuerName: <issuer-name>
      clusterName: <name of the NKP cluster to be used as the subject alternative name (SAN) in the TLS certificate in the TLS certificate.>
  ```
  ### For using a custom secret (secret should already be created in the namespace "ntnx-system", and it's reference should be provided as mentioned below)
  tls:
    webhook:
      mode: "SECRET"
      secretName: <name of the secret for webhook server>
    server:
      mode: "SECRET"
  For enabling MTLS between NDK intercom service running on source and replication kubernetes clusters, make sure that same certificate authority signs and issues certificates to NDK intercom service on primary and replication clusters. 
  To configure MTLS, following change in configuration should be made:
  ```
  tls:
    server:
      enableMTLS: true
  ```
  
