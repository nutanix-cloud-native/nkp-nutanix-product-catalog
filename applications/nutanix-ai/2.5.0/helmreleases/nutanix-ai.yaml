---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: nutanix-ai
  namespace: ${workspaceNamespace}
  labels:
    kommander.d2iq.io/dkp-airgapped: supported
spec:
  interval: 1m
  url: "oci://repos.ntnxdpro.com/ai-nai-core/nai-core"
  ref:
    tag: 0.1.0_build.2249
  secretRef:
    name: artifactory-secret
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nutanix-ai
  namespace: ${workspaceNamespace}
spec:
  dependsOn:
    - name: kserve
      namespace: ${workspaceNamespace}
    - name: kserve-crd
      namespace: ${workspaceNamespace}
    - name: nai-operators
      namespace: ${workspaceNamespace}
  chartRef:
    kind: OCIRepository
    name: nutanix-ai
    namespace: ${workspaceNamespace}
  interval: 15s
  install:
    remediation:
      retries: 30
    createNamespace: true
  upgrade:
    remediation:
      retries: 30
  uninstall:
    timeout: 15m
  releaseName: nutanix-ai
  valuesFrom:
    - kind: ConfigMap
      name: nutanix-ai-2.5.0-nkp-defaults
    - kind: ConfigMap
      name: service-monitor-defaults
  targetNamespace: nai-system
