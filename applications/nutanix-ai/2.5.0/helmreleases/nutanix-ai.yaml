---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: nutanix-ai
  namespace: ${workspaceNamespace}
  labels:
    kommander.d2iq.io/dkp-airgapped: supported
spec:
  interval: 1m
  url: "${ociRegistryURL:=oci://ghcr.io}/mesosphere/charts/nai-core"
  ref:
    tag: 2.5.0
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nutanix-ai
  namespace: ${workspaceNamespace}
spec:
  dependsOn:
    - name: kserve
      namespace: ${workspaceNamespace}
    - name: kserve-crd
      namespace: ${workspaceNamespace}
    - name: opentelemetry-operator
      namespace: ${workspaceNamespace}
    - name: nutanix-ai-operators
      namespace: ${workspaceNamespace}
  chartRef:
    kind: OCIRepository
    name: nutanix-ai
    namespace: ${workspaceNamespace}
  interval: 15s
  install:
    remediation:
      retries: 30
    createNamespace: true
  upgrade:
    remediation:
      retries: 30
  uninstall:
    timeout: 15m
  releaseName: nutanix-ai
  valuesFrom:
    - kind: ConfigMap
      name: nutanix-ai-2.5.0-nkp-defaults
    - kind: ConfigMap
      name: service-monitor-defaults
  targetNamespace: nai-system
  postRender:
    - kustomize:
        patches:
          - target:
              kind: ClusterRole
              name: nai-otel-role
            patch: |
              - op: add
                path: /rules/-
                value:
                  apiGroups: [""]
                  resources: ["services/kube-prometheus-stack-prometheus-node-exporter"]
                  verbs: ["get"]
