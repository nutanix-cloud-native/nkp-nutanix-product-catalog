overview: |-
  # Overview
  Nutanix Enterprise AI is a comprehensive inference endpoint management product designed to streamline and optimize your AI model orchestration experience. Nutanix Enterprise AI allows you to select, deploy, and manage large language models (LLMs) on a Kubernetes cluster.You can deploy Nutanix Enterprise AI on Nutanix Kubernetes Platform (NKP), and public cloud Kubernetes platforms such as Amazon Elastic Kubernetes Service (EKS), Azure Kubernetes Service (AKS), and Google Kubernetes Engine (GKE).

  ## For Information on Features
  - [Nutanix Enterprise AI Guide](https://portal.nutanix.com/page/documents/details?targetId=Nutanix-Enterprise-AI)

  ## Prerequisites and Configuration Guide
  ### Before you begin, ensure that you have a NKP cluster running Kubernetes version >= 1.33
  ### All the commands in this guide should be run on NKP cluster where Nutanix Enterprise AI is getting installed.
  ### Nutanix Enterprise AI 2.6.0 requires the following applications to be installed on the NKP cluster:
  - cert-manager v1.17.2
  - envoy-gateway v1.6.3
  - kube-prometheus-stack 71.0.1
  - nvidia-gpu-operator v25.3.1
  - kserve v0.15.0
  - opentelemetry-operator 0.102.0

  ### Create NutanixFiles storage class using the following manifest by replacing <nfs-path> and <nfs-server>:
    ```
    cat <<EOF | kubectl apply -f -
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: nai-nfs-storage
    parameters:
      nfsPath: <nfs-path>
      nfsServer: <nfs-server>
      storageType: NutanixFiles
    provisioner: csi.nutanix.com
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    EOF
    ```

  ### Create docker-registry secret in nai-system and envoy-gateway-system namespaces:
  Make sure secret name is same in both namespaces as the name is used in Catalog Application override values.
  ```
  # Replace <docker-username>, <docker-password>, and <docker-email> with your actual Docker Hub credentials.
  export REGISTRY_SECRET_NAME=nai-regcred
  export DOCKER_SERVER=https://index.docker.io/v1/
  export DOCKER_USERNAME=<docker-username>
  export DOCKER_PASSWORD=<docker-password>
  export DOCKER_EMAIL=<docker-email>

  kubectl create namespace nai-system --dry-run=client -o yaml | kubectl apply -f -

  kubectl create namespace envoy-gateway-system --dry-run=client -o yaml | kubectl apply -f -

  kubectl -n nai-system create secret docker-registry ${REGISTRY_SECRET_NAME} \
    --docker-server=${DOCKER_SERVER} \
    --docker-username=${DOCKER_USERNAME} \
    --docker-password=${DOCKER_PASSWORD} \
    --docker-email=${DOCKER_EMAIL} \
    --dry-run=client -o yaml | kubectl apply -f -

  kubectl -n envoy-gateway-system create secret docker-registry ${REGISTRY_SECRET_NAME} \
    --docker-server=${DOCKER_SERVER} \
    --docker-username=${DOCKER_USERNAME} \
    --docker-password=${DOCKER_PASSWORD} \
    --docker-email=${DOCKER_EMAIL} \
    --dry-run=client -o yaml | kubectl apply -f -
  ```

  ### During enabling of Nutanix Enterprise AI application from UI, provide following configuration:
  ```
  global:
    imagePullSecrets:
      - name: nai-regcred
  ```

  ## Validating the Installation
  Nutanix Enterprise AI card under cluster's Application page should be in Deployed state.
  ### In case if Nutanix Enterprise AI card is in Error or Failed state, check the following:
  - Check the status of Nutanix Enterprise AI HelmRelease:
    ```
    kubectl get helmrelease nutanix-ai-operators nutanix-ai -n <workspaceNamespace>
    ```
    - If any of above HelmReleases are in Error or Failed state, check the installation logs for errors.
    - Check the status of NAI pods:
      ```
      kubectl get pods -n nai-system
      ```
      - If any of the pods are in Error or Failed state, check the respective pod logs for errors.

  ## Post Installation Configuration

  Now you can access the Nutanix Enterprise AI dashboard by using cluster's Application Dashboard page card of Nutanix Enterprise AI.
  
  Default login credentials are:
  - Username: admin
  - Password: Nutanix.123
  ### Setup FQDN for Nutanix Enterprise AI dashboard:
  Create a DNS record to map the NAI ingress gateway IP to a FQDN.
  ```
  export NAI_UI_ENDPOINT=https://<FQDN>/
  kubectl patch cm nai-ui -n ${workspaceNamespace} -p '{"data":{"dashboardLink":"'${NAI_UI_ENDPOINT}'"}}'
  ```

  ### By default, Nutanix Enterprise AI uses a self-signed HTTPS certificate; follow the provided steps to replace it with a custom certificate for secure access.
  Create kubernetes secret of type tls with the certificate and key:
  ```
  kubectl create secret tls nai-ingress-certificate -n nai-system --cert=path/to/certificate.crt --key=path/to/private.key
  ```
  Patch the gateway nai-ingress-gateway with the secret:
  ```
  kubectl patch gateway nai-ingress-gateway -n nai-system --type='json' -p='[{"op": "replace", "path": "/spec/listeners/1/tls/certificateRefs/0/name", "value": "nai-ingress-certificate"}]'
  ```
