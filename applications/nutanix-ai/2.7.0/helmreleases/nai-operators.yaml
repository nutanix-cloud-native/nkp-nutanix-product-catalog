---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-nai-operators-2.7.0-chart
  namespace: ${workspaceNamespace}
spec:
  interval: 1m
  url: "oci://ghcr.io/mesosphere/charts/nai-operators"
  ref:
    tag: 2.7.0
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nutanix-ai-operators
  namespace: ${workspaceNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-nai-operators-2.7.0-chart
    namespace: ${workspaceNamespace}
  dependsOn:
    - name: kube-prometheus-stack
      namespace: ${workspaceNamespace}
    - name: nvidia-gpu-operator
      namespace: ${workspaceNamespace}
    - name: kserve
      namespace: ${workspaceNamespace}
    - name: kserve-crd
      namespace: ${workspaceNamespace}
    - name: envoy-gateway-nai
      namespace: ${workspaceNamespace}
    - name: opentelemetry-operator
      namespace: ${workspaceNamespace}
  interval: 15s
  install:
    remediation:
      retries: 30
    createNamespace: true
    timeout: 15m
    crds: Skip
  upgrade:
    remediation:
      retries: 30
    timeout: 15m
    crds: Skip
  uninstall:
    timeout: 15m
  releaseName: nutanix-ai-operators
  targetNamespace: nai-system
  valuesFrom:
    - kind: ConfigMap
      name: ${releaseName}-config-overrides
      optional: true
    - kind: ConfigMap
      name: ${releaseName}-cluster-overrides
      optional: true
