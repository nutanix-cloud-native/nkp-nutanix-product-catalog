displayName: NKP etcd Maintenance
description: >-
  Scheduled, leader-safe etcd defragmentation for kubeadm-managed NKP clusters.
  Wraps the upstream ahrtr/etcd-defrag binary as a CronJob with threshold-based
  execution, cluster health pre-checks, leader transfer, and configurable
  per-member pauses.
