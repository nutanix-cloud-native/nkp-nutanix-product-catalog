apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-${appVersion}-chart
  namespace: ${releaseNamespace}
spec:
  interval: 1m
  url: "oci://ghcr.io/mesosphere/charts/ndk"
  ref:
    tag: 2.0.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${releaseName}
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-${appVersion}-chart
    namespace: ${releaseNamespace}
  interval: 15s
  install:
    remediation:
      retries: 30
    createNamespace: false # Since "ntnx-system" namespace is already created during csi installation.
  upgrade:
    remediation:
      retries: 30
  releaseName: ndk
  valuesFrom:
    - kind: ConfigMap
      name: ${releaseName}-${appVersion}-defaults
  targetNamespace: ntnx-system
