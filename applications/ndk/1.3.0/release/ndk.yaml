apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ndk
  namespace: ${releaseNamespace}
spec:
  interval: 1m 
  url: "${ociRegistryURL:=oci://ghcr.io}/mesosphere/charts/ndk"
  ref:
    tag: 1.3.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ndk
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ndk
    namespace: ${releaseNamespace}
  interval: 15s
  install:
    remediation:
      retries: 30
    createNamespace: false # Since "ntnx-system" namespace is already created during csi installation.
  upgrade:
    remediation:
      retries: 30
  releaseName: ndk
  valuesFrom:
    - kind: ConfigMap
      name: ndk-1.3.0-defaults
  targetNamespace: ntnx-system
