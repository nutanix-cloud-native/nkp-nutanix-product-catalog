---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-39.0.7-chart
  namespace: ${workspaceNamespace}
spec:
  url: oci://ghcr.io/traefik/helm/traefik
  ref:
    tag: 39.0.7
  interval: 24h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-custom
  namespace: ${workspaceNamespace}
spec:
  interval: 15s
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-39.0.7-chart
    namespace: ${workspaceNamespace}
  install:
    crds: Skip
    remediation:
      retries: 30
    createNamespace: true
  upgrade:
    crds: Skip
    remediation:
      retries: 30
  releaseName: traefik-custom
  targetNamespace: traefik-system
  valuesFrom:
    - kind: ConfigMap
      name: ${releaseName}-config-defaults
    - kind: ConfigMap
      name: ${releaseName}-config-overrides
      optional: true
    - kind: ConfigMap
      name: ${releaseName}-cluster-overrides
      optional: true
