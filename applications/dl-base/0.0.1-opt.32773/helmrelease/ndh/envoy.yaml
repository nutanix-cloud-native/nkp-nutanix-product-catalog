# PROBABLY NOT NEEDED ON A CLUSTER WHERE THERE ARE ENOUGH FREE IP ADDRESSES!
# 
# LoadBalancer would be (stay) the serviceType for the Envoy service and this
# workaround would not be needed.

# With tls.postInstallJob.serviceType NodePort, ndh-ingress-cert-patch points the Gateway at
# envoy-service-config. That EnvoyProxy replaces (does not merge with) the GatewayClass's
# ndh-envoy-proxy, so it must repeat its image and pull secret, or Envoy falls back to docker.io.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-service-config
  namespace: ndh-core
spec:
  logging:
    level:
      default: warn
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          image: artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker/envoy-proxy-envoy:distroless-v1.35.0
        pod:
          imagePullSecrets:
          - name: ndh-iep-secret
      envoyService:
        type: NodePort
---
# The Job's `kubectl apply -f -` of envoy-service-config would delete every field above that it
# does not set itself (client-side and server-side apply alike, once the object carries a
# last-applied annotation). Create-or-merge-patch only ever adds or changes fields.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ndh-ingress-cert-patch-kubectl
  namespace: ndh-core
data:
  kubectl: |
    #!/bin/sh
    [ "$1" = apply ] || exec /usr/bin/kubectl "$@"
    shift
    manifest=$(mktemp)
    cat > "$manifest"
    ns=""
    while [ $# -gt 0 ]; do
      case "$1" in
        -n|--namespace) ns="--namespace=$2"; shift 2 ;;
        *) shift ;;
      esac
    done
    /usr/bin/kubectl create $ns -f "$manifest" 2>/dev/null ||
      /usr/bin/kubectl patch $ns -f "$manifest" --type=merge --patch-file="$manifest"
---
