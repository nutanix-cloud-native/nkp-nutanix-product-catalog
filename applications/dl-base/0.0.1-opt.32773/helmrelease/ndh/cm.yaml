apiVersion: v1
data:
  values.yaml: |
    tags:
      kLargeCluster: true
    ndh-api-pc:
      env:
        # SMSP value that needs to be empty, as it does not exist on NKP.
        smsp_lb_ip: ""
    cloudnative-pg:
      image:
        # Redirecting the image to Artifactory.
        repository: artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker/cloudnative-pg/cloudnative-pg
    cloudnative-pg-cluster:
      # When the field is set, the template writes the 'priorityClassName' key twice,
      # which Flux's strict YAML parser rejects. Setting it to empty avoids that.
      priorityClassName: ""
      # Redirecting the image to Artifactory.
      image:
        repository: artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker/cloudnative-pg/postgresql
      database:
        # Setting the storage class to Nutanix Volume.
        storageClass: nutanix-volume
    envoy-gateway:
      global:
        images:
          envoyGateway:
            # Redirecting the image to Artifactory.
            image: artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker/envoy-proxy-gateway:v1.5.0
    ndh-gateway:
      dataPlane:
        image:
          # Redirecting the image to Artifactory.
          registry: artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker
      tls:
        postInstallJob:
          # Both MetalLB addresses on this cluster are already taken, so this is
          # not set to be a LoadBalancer, but rather a NodePort.
          serviceType: NodePort
          # Resources raised to 256Mi memory to avoid OOM kills, which happened
          # when the default 64Mi limit was used.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
    qdrant:
      sizingProfiles:
        kLargeCluster:
          # Setting the number of replicas to 1 (reduced from 2) to fit the cluster's resources.
          replicas: 1
          resources:
            limits:
              # Setting the CPU limit to 1 (reduced from 5) to fit the cluster's resources.
              cpu: "1"
              # Setting the memory limit to 4Gi (reduced from 40Gi) to fit the cluster's resources.
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 4Gi
      storage:
        size: 50Gi
        storageClassName: nutanix-volume
    ndh-ray-etl:
      # Redirecting the image to Artifactory.
      image:
        localRepository: artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker/nutanix-core/data-lens-onprem-dev/ndh-ray-etl
      # Setting the storage class to Nutanix Volume.
      volume:
        storage_class: nutanix-volume
      # Disabling the metrics collection, as Prometheus is not installed on this cluster.
      metrics:
        podMonitor:
          enabled: false
      # Setting the head resources to 2 CPU and 4Gi because with less resources, the head's
      # `ray health-check` liveness probe exceeds its 10s timeout and the head is restarted.
      head:
        sizingProfiles:
          kLargeCluster:
            resources:
              limits:
                cpu: "2"
                memory: 4Gi
              requests:
                cpu: "2"
                memory: 4Gi
      worker:
        sizingProfiles:
          kLargeCluster:
            # Setting the number of replicas to 1 (reduced from 3) to fit the cluster's resources.
            replicas: 1
            resources:
              limits:
                # Setting the CPU limit to 2 (reduced from 7) to fit the cluster's resources.
                cpu: "2"
                # Setting the memory limit to 6Gi (reduced from 16Gi) to fit the cluster's resources.
                memory: 6Gi
              requests:
                cpu: "2"
                memory: 6Gi
kind: ConfigMap
metadata:
  name: ${releaseName}-ndh-config-defaults
  namespace: ${releaseNamespace}
---
