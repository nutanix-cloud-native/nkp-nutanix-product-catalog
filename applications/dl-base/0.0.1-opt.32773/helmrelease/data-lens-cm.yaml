apiVersion: v1
data:
  values.yaml: |
    dl-db-access:
      size: kLarge
      dlDBAccessService:
        imagePullSecrets:
        - name: ${releaseName}-artifactory-pull
    dl-sync-service:
      size: kLarge
      env:
        smsp_lb_ip: ""
        smspUuid: ""
        dl_app_version: "3.0.0"
        is_bootstrap_run: true
      volumes:
      - name: sync-service-certs
        secret:
          secretName: dl-sync-service-tls
          items:
          - key: ca.crt
            path: ca.pem
          - key: tls.crt
            path: cert
          - key: tls.key
            path: key
      volumeMounts:
      - name: sync-service-certs
        mountPath: /opt/nutanix/sync_service/certs
        readOnly: true
    dl-dp-ingestion:
      size: kLarge
    dl-objects-ingestion:
      size: kLarge
    dl-dp-receiver:
      # The receiver's health check dials the Service by this name.
      fullnameOverride: dl-dp-receiver
      size: kLarge
      env:
        smsp_lb_ip: ""
        pcFqdn: ""
        cluster_instance_name: ""
    dl-api-gateway:
      size: kLarge
      env:
        smsp_lb_ip: ""
        pcFqdn: ""
        cluster_instance_name: ""
    dl-react-ui:
      size: kLarge
    dl-files-processing-svc:
      size: kLarge
    dl-job-framework:
      size: kLarge
      env:
        smsp_lb_ip: ""
      volume:
        storage_class: nutanix-volume
    dl-ransomware-protection:
      size: kLarge
kind: ConfigMap
metadata:
  name: ${releaseName}-data-lens-config-defaults
  namespace: ${releaseNamespace}
---
