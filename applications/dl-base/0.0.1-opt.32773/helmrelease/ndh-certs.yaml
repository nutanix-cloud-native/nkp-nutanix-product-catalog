apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ndh-ingress
  namespace: ndh-core
spec:
  secretName: ndh-ingress-msp-cert
  issuerRef:
    kind: ClusterIssuer
    name: kommander-ca
  commonName: ndh-ingress-gateway
  dnsNames:
  - ndh-ingress-gateway
  - ndh-ingress-gateway.ndh-core.svc
  usages:
  - server auth
---
# One cert per MSP cert_service_name (service.msp.ntnx.io/cert_* pod annotations), all from the
# same CA so the services trust each other; ndh.yaml post-renderers mount them as cert/key/ca.pem.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: msp-ndh-api-pc
  namespace: ndh-core
spec:
  secretName: msp-cert-ndh-api-pc
  issuerRef:
    kind: ClusterIssuer
    name: kommander-ca
  commonName: ndh-api-pc
  dnsNames:
  - ndh-api-pc
  - ndh-ndh-api-pc
  - ndh-ndh-api-pc.ndh-core
  - ndh-ndh-api-pc.ndh-core.svc
  - ndh-ndh-api-pc.ndh-core.svc.cluster.local
  usages:
  - server auth
  - client auth
---
