# The dl-base chart creates these namespaces, but the certificates, ConfigMaps and
# ServiceAccounts in this directory must land in them before it has run. The Helm ownership
# metadata lets the dl-base release adopt them instead of failing on "already exists".
apiVersion: v1
kind: Namespace
metadata:
  name: data-lens
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: dl-base
    meta.helm.sh/release-namespace: ${releaseNamespace}
---
apiVersion: v1
kind: Namespace
metadata:
  name: ndh-core
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: dl-base
    meta.helm.sh/release-namespace: ${releaseNamespace}
---
