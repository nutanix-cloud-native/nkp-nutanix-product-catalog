apiVersion: v1
data:
  values.yaml: |
    zookeeper:
      zk:
        storageClassName: nutanix-volume
    clickhouse-keeper:
      clickhouseKeeper:
        image:
          localRepository: artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker/cpaas-clickhouse-keeper
        storage:
          storageClassName: nutanix-volume
      serviceMonitor:
        enabled: false
    clickhouse-server:
      clickhouse:
        image:
          localRepository: artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker/cpaas-clickhouse-server
        storage:
          storageClass: nutanix-volume
          pvcStorage: 2000Gi
        # Reduced from the requested 4 CPU / 32Gi to fit this cluster's 8 CPU / ~30.9Gi workers.
        qos:
          custom:
            resources:
              limits:
                cpu: "2"
                memory: 8Gi
              requests:
                cpu: "2"
                memory: 8Gi
    cpaas-nats-helm:
      auth:
        resolver:
          store:
            storageClassName: nutanix-volume
      exporter:
        enabled: false
      nats:
        jetstream:
          fileStorage:
            storageClassName: nutanix-volume
        qos:
          custom:
            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                memory: 2Gi
    cpaas-nats-entities:
      streamConsumer:
        qos:
          cluster:
            size: large
    ikat:
      enabled: false
    msp-prometheus-collector:
      enabled: false
kind: ConfigMap
metadata:
  name: ${releaseName}-dl-common-config-defaults
  namespace: ${releaseNamespace}
---
