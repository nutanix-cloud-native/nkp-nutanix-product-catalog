apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ${releaseName}-dl-common-repo
  namespace: ${releaseNamespace}
spec:
  interval: 10m
  secretRef:
    name: ${releaseName}-artifactory-auth
  certSecretRef:
    name: ${releaseName}-artifactory-ca
  passCredentials: true
  type: default
  url: https://artifactory.canaveral-corp.us-west-2.aws/artifactory/local-canaveral-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dl-common
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: dl-common
      interval: 10m
      sourceRef:
        kind: HelmRepository
        name: ${releaseName}-dl-common-repo
        namespace: ${releaseNamespace}
      version: 3.0.0-release.19
  dependsOn:
  - name: dl-base
  install:
    createNamespace: true
    crds: Skip
    remediation:
      retries: 30
  interval: 15s
  # Only the "largecluster"/"mediumcluster" NATS profiles define the ndh_transformation_* and
  # dl_dc_result streams, but they ask for 3 replicas and this cluster runs a single NATS node.
  # The Job therefore reads a copy of "largecluster" with every replica count rewritten to 1.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Job
          name: stream-consumer-deployment-job-.*
        patch: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: stream-consumer-deployment-job
          spec:
            template:
              spec:
                volumes:
                - name: nats-entities
                  emptyDir: {}
                initContainers:
                - name: single-replica-profile
                  # Must match the stream-consumer-creation image.
                  image: artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker/cpaas-nats-catalog:0.59.0
                  command:
                  - sh
                  - -ec
                  - |
                    cp -r /nats/datalens/largecluster/. /work/
                    sed -i -E 's/"num_replicas"( *): *3/"num_replicas"\1: 1/' /work/streams/*.json
                    sed -i 's/--replicas=3/--replicas=1/' /work/kv-buckets/commands.txt
                  resources:
                    requests: {cpu: 10m, memory: 16Mi}
                    limits: {memory: 64Mi}
                  volumeMounts:
                  - {name: nats-entities, mountPath: /work}
                containers:
                - name: stream-consumer-creation
                  volumeMounts:
                  - {name: nats-entities, mountPath: /nats/datalens/largecluster}
  releaseName: dl-common
  targetNamespace: ${releaseNamespace}
  timeout: 20m
  upgrade:
    crds: Skip
    remediation:
      retries: 30
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-dl-common-config-defaults
---
