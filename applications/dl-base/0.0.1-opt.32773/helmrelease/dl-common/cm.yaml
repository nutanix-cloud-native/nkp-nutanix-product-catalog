apiVersion: v1
data:
  values.yaml: |
    # storageClassName is set to nutanix-volume, because NKP uses Nutanix CSI StorageClass instead of the MSP one
    zookeeper:
      zk:
        storageClassName: nutanix-volume
    clickhouse-keeper:
      clickhouseKeeper:
        # Same image override as clickhouse-server below (default: nutanix/cpaas-clickhouse-keeper).
        image:
          localRepository: artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker/cpaas-clickhouse-keeper
        storage:
          storageClassName: nutanix-volume
      # [TODO] Turns off the Prometheus ServiceMonitor, which MSP's monitoring stack expects,
      # but NKP does not have it enabled yet.
      serviceMonitor:
        enabled: false
    clickhouse-server:
      clickhouse:
        # For the clickhouse-server, we have the following default values:
        # - image.registry: artifactory.dyn.ntnxdpro.com
        # - image.repository: canaveral-legacy-docker/cpaas-clickhouse-server
        # - image.tag: "25.3.5.42"
        # - image.localRepository: nutanix/cpaas-clickhouse-server
        #
        # registry + repository already point at Artifactory. The ClickHouse pods don't use them, though.
        # Only a helper DaemonSet uses them (templates/pull_image.yaml).
        # It downloads the image onto each node ahead of time, for Nutanix's SMSP platform.
        #
        # localRepository is what the real ClickHouse pod uses:
        # image: {{ .Values.clickhouse.image.localRepository }}:{{ .Values.clickhouse.image.tag }}
        #
        # With the default, the pod asks for nutanix/cpaas-clickhouse-server:25.3.5.42.
        # That name has no registry host, so Kubernetes looks for it on Docker Hub (docker.io/nutanix/...).
        #
        # On SMSP, the image already exists on the node, so nothing is ever pulled. On NKP, it does not and
        # the pull fails with ImagePullBackOff.
        #
        # Setting the localRepository to artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker/cpaas-clickhouse-server
        # makes the pod pull from Artifactory instead. It pulls with the dl-base-artifactory-pull
        # secret attached to the default ServiceAccount.
        image:
          localRepository: artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker/cpaas-clickhouse-server
        storage:
          storageClass: nutanix-volume
          pvcStorage: 2000Gi
        # [RESOURCE ISSUE] Reduced from the 4 CPU / 32Gi requested in the dl-common config (chart default:
        # 2 CPU / 16Gi) to fit this cluster's 8 CPU / ~30.9Gi workers next to the other data-lens pods.
        qos:
          custom:
            resources:
              limits:
                cpu: "2"
                memory: 8Gi
              requests:
                cpu: "2"
                memory: 8Gi
    cpaas-nats-helm:
      # Sets the StorageClass for the NATS account resolver.
      auth:
        resolver:
          store:
            storageClassName: nutanix-volume
      # Turns off the metrics sidecar.
      exporter:
        enabled: false
      nats:
        jetstream:
          # JetStream reserves every stream's max_bytes up front; the "largecluster" streams
          # need ~603G, more than the 610G default leaves. Same as SMSP.
          fileStorage:
            storageClassName: nutanix-volume
            size:
              small: 650Gi
            maxFile: 650G
        # [RESOURCE ISSUE] 1 CPU / 2Gi as requested in the dl-common config (chart default: 500m / 1Gi, limit 1 CPU).
        qos:
          custom:
            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                memory: 2Gi
    cpaas-nats-entities:
      streamConsumer:
        qos:
          cluster:
            # Only 'largecluster' and 'mediumcluster' include the ndh_transformation_* and
            # dl_dc_result streams that ndh and data-lens need.
            size: largecluster
    ikat:
      enabled: false
    # Turns off MSP-specific metrics collector.
    msp-prometheus-collector:
      enabled: false
kind: ConfigMap
metadata:
  name: ${releaseName}-dl-common-config-defaults
  namespace: ${releaseNamespace}
---
