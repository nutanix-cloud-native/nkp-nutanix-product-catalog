---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-0.19.0-chart
  namespace: ${workspaceNamespace}
spec:
  url: oci://ghcr.io/kserve/charts/kserve-resources
  ref:
    tag: v0.19.0
  interval: 24h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve
  namespace: ${workspaceNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-0.19.0-chart
    namespace: ${workspaceNamespace}
  dependsOn:
  - name: kserve-crd
  interval: 15s
  install:
    strategy:
      name: RetryOnFailure
    remediation:
      retries: 30
    createNamespace: true
  upgrade:
    strategy:
      name: RetryOnFailure
    remediation:
      retries: 30
  releaseName: kserve
  targetNamespace: kserve
  values:
    kserve:
      controller:
        deploymentMode: RawDeployment
        gateway:
          disableIngressCreation: true
