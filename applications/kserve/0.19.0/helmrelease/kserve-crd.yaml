---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-crd-0.15.0-chart
  namespace: ${workspaceNamespace}
spec:
  url: oci://ghcr.io/kserve/charts/kserve-crd
  ref:
    tag: v0.15.0
  interval: 10m
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-crd
  namespace: ${workspaceNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-crd-0.15.0-chart
    namespace: ${workspaceNamespace}
  interval: 15s
  install:
    crds: CreateReplace
    remediation:
      retries: 30
    createNamespace: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 30
  releaseName: kserve-crd
  targetNamespace: kserve
