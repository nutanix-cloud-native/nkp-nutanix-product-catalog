---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-0.8.0-chart
  namespace: ${workspaceNamespace}
spec:
  url: oci://registry.k8s.io/lws/charts/lws
  ref:
    tag: 0.8.0
  interval: 24h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lws
  namespace: ${workspaceNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-0.8.0-chart
    namespace: ${workspaceNamespace}
  interval: 15s
  install:
    strategy:
      name: RetryOnFailure
    remediation:
      retries: 30
    createNamespace: true
  upgrade:
    strategy:
      name: RetryOnFailure
    remediation:
      retries: 30
  releaseName: lws
  targetNamespace: lws-system
