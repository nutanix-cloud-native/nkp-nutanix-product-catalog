apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
# Gives the NKP instance name '${releaseName}' to the HelmRelease and stores it in the namespace ${releaseNamespace}.
metadata:
  name: ${releaseName}
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      # The name of the chart that needs to be installed.
      chart: custom-dl-base
      # How often Flux checks the HelmRepository for a new copy of the chart.
      interval: 10m
      # The source of the chart is a HelmRepository in the namespace ${releaseNamespace}
      # of the provided name ${releaseName}-charts.
      sourceRef:
        kind: HelmRepository
        name: ${releaseName}-charts
        namespace: ${releaseNamespace}
      # The version of the chart that needs to be installed.
      version: 0.5.0
  install:
    # Creates the target namespace, if it does not exist yet.
    createNamespace: true
    # Install the ClickHouse and Ray CRDs shipped by the chart before its custom resources.
    crds: Create
    # If the install fails, Flux uninstalls the failed release and tries again up to 'retries'
    # number of times.
    remediation:
      retries: 30
  # How often the helm-controller checks that the installed release still matches this HelmRelease.
  interval: 15s
  # The name of the Helm release, as shown by 'helm list'.
  releaseName: datahub
  # The namespace the chart's resources are installed into, which also holds the Helm release history.
  targetNamespace: ${releaseNamespace}
  # Settings for upgrades, which happen whenever the chart version or the values change.
  upgrade:
    # Existing CRDs are not changed automatically during upgrades.
    crds: Skip
    # If the upgrade fails, Flux rolls back to the last working release and tries again, up to 30 times.
    remediation:
      retries: 30
  # Reads the values from the ConfigMap '${releaseName}-config-defaults' in the namespace ${releaseNamespace},
  # which is actually the cm.yaml file from the same folder.
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-config-defaults
  # The 'dl-mspdeployedparams' values entered in NKP's UI. NKP creates this ConfigMap outside the
  # catalog bundle, so the catalog builder requires the reference to be optional; the
  # the base chart fails with a clear message when the values are missing.
  - kind: ConfigMap
    name: ${releaseName}-config-overrides
    optional: true
---
