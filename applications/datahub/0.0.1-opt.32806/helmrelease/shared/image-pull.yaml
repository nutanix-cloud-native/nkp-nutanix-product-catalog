# Most images are hosted on private registry (artifactory.dyn.ntnxdpro.com), which needs credentials.
# The Data Lens and NDH charts take 'imagePullSecrets' in their values, but the upstream zookeeper
# and cpaas-nats-entities charts do not. Kubernetes adds a service account's pull secrets to every
# pod that runs under it and does not set a pull secret of its own, so the 'default' service
# account of each namespace carries them.
# Both secrets are created by prerequisite.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: data-lens
imagePullSecrets:
- name: ${releaseName}-artifactory-pull
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ndh-core
# Reused the name 'ndh-iep-secret' as it is the name that is present in the ndh chart.
# It holds the same credentials as the other one, but for TWO registries:
# - artifactory.dyn.ntnxdpro.com
# - artifactory-edge-01.corp.p10y.ntnxdpro.com
imagePullSecrets:
- name: ndh-iep-secret
---
