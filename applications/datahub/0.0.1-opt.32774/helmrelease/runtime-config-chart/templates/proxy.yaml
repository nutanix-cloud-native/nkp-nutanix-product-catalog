{{- $pcIp := (index .Values "dl-mspdeployedparams").prismCentral.ip -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dl-pc-proxy
  namespace: data-lens
data:
  default.conf: |
    server {
      listen 9444;
      location /v3/ {
        proxy_pass https://{{ $pcIp }}:9440/api/nutanix/v3/;
        proxy_ssl_verify off;
        include /etc/nginx/pc-auth/auth.conf;
      }
      location / {
        proxy_pass https://{{ $pcIp }}:9440;
        proxy_ssl_verify off;
        include /etc/nginx/pc-auth/auth.conf;
      }
    }
    server {
      listen 8445 ssl;
      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      location / {
        proxy_pass https://{{ $pcIp }}:9440;
        proxy_ssl_verify off;
        include /etc/nginx/pc-auth/auth.conf;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dl-pc-proxy
  namespace: data-lens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dl-pc-proxy
  template:
    metadata:
      labels:
        app: dl-pc-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - name: ikat
          containerPort: 9444
        - name: iam
          containerPort: 8445
        readinessProbe:
          tcpSocket:
            port: 9444
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d
        - name: auth
          mountPath: /etc/nginx/pc-auth
          readOnly: true
        - name: tls
          mountPath: /etc/nginx/tls
          readOnly: true
      volumes:
      - name: conf
        configMap:
          name: dl-pc-proxy
      - name: auth
        secret:
          secretName: dl-pc-proxy-auth
      - name: tls
        secret:
          # The custom data-lens chart creates this MSP-compatible secret when
          # its native cert-manager integration is enabled.
          secretName: msp-cert-dl-sync-service
---
apiVersion: v1
kind: Service
metadata:
  name: dl-pc-proxy
  namespace: data-lens
spec:
  selector:
    app: dl-pc-proxy
  ports:
  - name: ikat
    port: 9444
    targetPort: ikat
  - name: iam
    port: 8445
    targetPort: iam
