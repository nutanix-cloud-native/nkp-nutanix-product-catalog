# All Data Hub charts (custom-dl-base, custom-dl-common, custom-data-lens and custom-ndh)
# are published to the same public GitHub Container Registry OCI repository.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ${releaseName}-charts
  namespace: ${releaseNamespace}
  annotations:
    # Keep the chart source available until the pre-delete hook has
    # uninstalled the dependent HelmReleases.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 10m
  type: oci
  url: oci://ghcr.io/mirko38/nkp-nutanix-product-catalog/charts
---
