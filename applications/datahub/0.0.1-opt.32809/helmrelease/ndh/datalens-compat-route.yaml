apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ndh-datalens-compat-route
  namespace: data-lens
  labels:
    app.kubernetes.io/instance: data-lens
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
  - name: ndh-ingress-gateway
    namespace: ndh-core
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /datalens/api
    - path:
        type: PathPrefix
        value: /api/dl
    backendRefs:
    - name: dl-api-gateway
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /fa/api
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /datalens/api
    backendRefs:
    - name: dl-api-gateway
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /datalens/static
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /static
    backendRefs:
    - name: data-lens-dl-react-ui
      port: 3000
  - matches:
    - path:
        type: PathPrefix
        value: /datalens
    backendRefs:
    - name: data-lens-dl-react-ui
      port: 3000
