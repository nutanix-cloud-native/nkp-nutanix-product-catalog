apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ndh-datalens-compat-route
  namespace: ${releaseNamespace}
  labels:
    app.kubernetes.io/instance: ndh
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
  - name: ndh-ingress-gateway
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /datalens
    filters:
    - type: RequestRedirect
      requestRedirect:
        statusCode: 302
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /ndh
