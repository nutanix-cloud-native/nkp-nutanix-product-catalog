apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: data-lens
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: custom-data-lens
      interval: 10m
      sourceRef:
        kind: HelmRepository
        name: ${releaseName}-canaveral-helm
        namespace: ${releaseNamespace}
      version: 0.1.0
  # The data-lens chart depends on the dl-common chart.
  dependsOn:
  - name: dl-common
  install:
    createNamespace: true
    crds: Skip
    # Disable waiting for the sync job to complete, because it lasts for a long time and it
    # should not block the release.
    disableWaitForJobs: true
    remediation:
      retries: 30
  interval: 15s
  # The chart now creates and mounts the MSP-compatible cert-manager secrets.
  # Keep only the NKP startup fix for the receiver self-readiness loop.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Service
          name: dl-dp-receiver
        patch: |
          - op: add
            path: /spec/publishNotReadyAddresses
            value: true
  releaseName: data-lens
  targetNamespace: ${releaseNamespace}
  timeout: 20m
  upgrade:
    crds: Skip
    disableWaitForJobs: true
    remediation:
      retries: 30
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-data-lens-config-defaults
---
