apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dl-runtime-config
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: dl-runtime-config
      version: 0.1.11
      interval: 10m
      sourceRef:
        kind: HelmRepository
        name: ${releaseName}-canaveral-helm
        namespace: ${releaseNamespace}
  install:
    createNamespace: true
    crds: Skip
    remediation:
      retries: 30
  interval: 15s
  releaseName: dl-runtime-config
  targetNamespace: ${releaseNamespace}
  timeout: 10m
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-config-overrides
    # This ConfigMap is created externally by NKP's UI and is not part of the
    # catalog bundle, so the catalog builder requires this reference to remain
    # optional. The runtime chart templates use `required` for every value and
    # fail clearly if the UI configuration is absent or incomplete.
    optional: true
  upgrade:
    crds: Skip
    remediation:
      retries: 30
