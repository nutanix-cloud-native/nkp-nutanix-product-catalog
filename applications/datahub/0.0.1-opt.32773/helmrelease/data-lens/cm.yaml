apiVersion: v1
data:
  values.yaml: |
    dl-db-access:
      size: kLarge
      imagePullSecrets:
      - name: ${releaseName}-artifactory-pull
    dl-sync-service:
      size: kLarge
      certs:
        enabled: true
        issuerRef:
          kind: ClusterIssuer
          name: kommander-ca
        extraDnsNames:
        - iam-proxy.ntnx-base
        - iam-proxy.ntnx-base.svc
        - iam-proxy.ntnx-base.svc.cluster.local
      env:
        # SMSP value that needs to be empty, as it does not exist on NKP.
        smsp_lb_ip: ""
        # SMSP value that needs to be empty, as it does not exist on NKP.
        smspUuid: ""
        # Data Lens app version.
        dl_app_version: "0.0.1"
        # Makes it run its first-time setup and create its PC user and access key.
        is_bootstrap_run: true
    dl-dp-ingestion:
      size: kLarge
    dl-objects-ingestion:
      size: kLarge
    dl-dp-receiver:
      # The receiver's health check dials the Service by this name.
      fullnameOverride: dl-dp-receiver
      size: kLarge
      certs:
        enabled: true
        issuerRef:
          kind: ClusterIssuer
          name: kommander-ca
      env:
        # SMSP value that needs to be empty, as it does not exist on NKP.
        smsp_lb_ip: ""
        # SMSP value that needs to be empty, as it does not exist on NKP.
        pcFqdn: ""
        # SMSP value that needs to be empty, as it does not exist on NKP.
        cluster_instance_name: ""
    dl-api-gateway:
      size: kLarge
      certs:
        enabled: true
        issuerRef:
          kind: ClusterIssuer
          name: kommander-ca
      env:
        # SMSP value that needs to be empty, as it does not exist on NKP.
        smsp_lb_ip: ""
        # SMSP value that needs to be empty, as it does not exist on NKP.
        pcFqdn: ""
        # SMSP value that needs to be empty, as it does not exist on NKP.
        cluster_instance_name: ""
    dl-react-ui:
      size: kLarge
      certs:
        enabled: true
        issuerRef:
          kind: ClusterIssuer
          name: kommander-ca
    dl-files-processing-svc:
      size: kLarge
      certs:
        enabled: true
        issuerRef:
          kind: ClusterIssuer
          name: kommander-ca
    dl-job-framework:
      size: kLarge
      certs:
        enabled: true
        issuerRef:
          kind: ClusterIssuer
          name: kommander-ca
      env:
        # SMSP value that needs to be empty, as it does not exist on NKP.
        smsp_lb_ip: ""
      volume:
        # Set the storage class to nutanix-volume, because NKP uses Nutanix CSI StorageClass
        storage_class: nutanix-volume
    dl-ransomware-protection:
      size: kLarge
      certs:
        enabled: true
        issuerRef:
          kind: ClusterIssuer
          name: kommander-ca
kind: ConfigMap
metadata:
  name: ${releaseName}-data-lens-config-defaults
  namespace: ${releaseNamespace}
---
