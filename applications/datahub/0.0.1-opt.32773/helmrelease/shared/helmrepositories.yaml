# Both chart sources use the same public GitHub Container Registry OCI repository.
# The source names remain unchanged so the HelmReleases do not need sourceRef changes.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ${releaseName}-canaveral-helm-backup
  namespace: ${releaseNamespace}
  annotations:
    # Keep the chart source available until the pre-delete hook has
    # uninstalled the dependent HelmReleases.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 10m
  type: oci
  url: oci://ghcr.io/mirko38/nkp-nutanix-product-catalog/charts
---
# dl-common, data-lens and ndh use the same OCI repository.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ${releaseName}-canaveral-helm
  namespace: ${releaseNamespace}
  annotations:
    # The cleanup hook deletes this source after its HelmReleases disappear.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 10m
  type: oci
  url: oci://ghcr.io/mirko38/nkp-nutanix-product-catalog/charts
---
