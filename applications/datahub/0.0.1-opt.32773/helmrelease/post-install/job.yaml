apiVersion: batch/v1
kind: Job
metadata:
  name: ${releaseName}-ui-link
  namespace: ${releaseNamespace}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: null
  template:
    spec:
      serviceAccountName: ${releaseName}-postinstall
      restartPolicy: OnFailure
      containers:
      - name: discover-ui-endpoint
        image: mesosphere/kubectl:v1.34.1-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: WORKSPACE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        command:
        - /bin/sh
        - -c
        - |
          set -eu

          echo "Waiting for the NDH gateway LoadBalancer address..."
          for i in $(seq 1 120); do
            ADDRESS="$(
              kubectl get service -A \
                -l gateway.envoyproxy.io/owning-gateway-name=ndh-ingress-gateway \
                -o jsonpath='{range .items[*]}{.status.loadBalancer.ingress[0].ip}{"\n"}{.status.loadBalancer.ingress[0].hostname}{"\n"}{end}' \
                2>/dev/null | awk 'NF { print; exit }'
            )"

            if [ -n "$ADDRESS" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$ADDRESS" ]; then
            echo "ERROR: NDH gateway has no LoadBalancer IP or hostname"
            exit 1
          fi

          ENDPOINT="https://$${ADDRESS}/ndh"
          PAYLOAD=$(printf '{"data":{"dashboardLink":"%s"}}' "$ENDPOINT")
          kubectl patch configmap datahub-app-dashboard-info \
            -n "$WORKSPACE_NAMESPACE" \
            --type=merge \
            -p "$PAYLOAD"
          echo "Data Hub dashboard link updated."
