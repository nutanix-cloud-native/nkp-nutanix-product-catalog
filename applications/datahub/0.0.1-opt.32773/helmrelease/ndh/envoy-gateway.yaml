# ndh 0.0.1-opt.38095 no longer bundles Envoy Gateway and expects the MSP-only Ikat
# gateway instead. This release restores the Envoy Gateway controller that serves
# the ndh-ingress-gateway Gateway on NKP.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ${releaseName}-envoyproxy
  namespace: ${releaseNamespace}
spec:
  interval: 10m
  type: oci
  url: oci://docker.io/envoyproxy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ndh-envoy-gateway
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: gateway-helm
      interval: 10m
      sourceRef:
        kind: HelmRepository
        name: ${releaseName}-envoyproxy
        namespace: ${releaseNamespace}
      version: v1.5.0
  install:
    # Creates only the Envoy Gateway CRDs that are missing. NKP already provides
    # the Gateway API CRDs, which are left untouched.
    crds: Create
    # envoy-gateway-certgen deletes itself 30 seconds after it finishes.
    disableWaitForJobs: true
    remediation:
      retries: 30
  interval: 15s
  releaseName: envoy-gateway
  storageNamespace: ${releaseNamespace}
  targetNamespace: ndh-core
  timeout: 10m
  upgrade:
    crds: Skip
    disableWaitForJobs: true
    remediation:
      retries: 30
  values:
    fullnameOverride: envoy-gateway
    deployment:
      priorityClassName: dl-medium-priority
    global:
      imagePullSecrets:
      - name: ndh-iep-secret
      images:
        envoyGateway:
          image: artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker/envoy-proxy-gateway:v1.5.0
          pullPolicy: IfNotPresent
        ratelimit:
          image: artifactory.dyn.ntnxdpro.com/canaveral-legacy-docker/envoy-proxy-ratelimit:3e085e5b
          pullPolicy: IfNotPresent
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: ndh-gatewayclass
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
