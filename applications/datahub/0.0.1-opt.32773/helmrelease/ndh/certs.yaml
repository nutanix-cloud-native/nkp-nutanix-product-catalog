# dnsNames are the hostnames a client may dial; TLS verification fails for any name not listed.
# A service <svc> in namespace <ns> can be reached as:
#   <svc>                          from pods in the same namespace
#   <svc>.<ns>                     from other namespaces
#   <svc>.<ns>.svc                 same, more explicit
#   <svc>.<ns>.svc.cluster.local   fully qualified name
# so every service a certificate is served on gets all four. The MSP cert_service_name is always
# listed as well, because that is the name MSP would issue the certificate under.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ndh-ingress
  namespace: ndh-core
spec:
  secretName: ndh-ingress-msp-cert
  issuerRef:
    kind: ClusterIssuer
    name: kommander-ca
  commonName: ndh-ingress-gateway
  # Named after the Gateway 'ndh-ingress-gateway'; Envoy creates its Service under a generated name
  # (envoy-ndh-core-ndh-ingress-gateway-<hash>) and exposes it as a LoadBalancer.
  # The certificate identifies the Gateway's internal service names; the external LoadBalancer
  # IP is not a DNS name and therefore is not included in dnsNames.
  dnsNames:
  - ndh-ingress-gateway
  - ndh-ingress-gateway.ndh-core.svc
  usages:
  - server auth
---
# One cert per MSP cert_service_name (service.msp.ntnx.io/cert_* pod annotations), all from the
# same CA, so the services trust each other; helmrelease.yaml post-renderers mount them as cert/key/ca.pem.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: msp-ndh-api-pc
  namespace: ndh-core
spec:
  secretName: msp-cert-ndh-api-pc
  issuerRef:
    kind: ClusterIssuer
    name: kommander-ca
  commonName: ndh-api-pc
  # cert_service_name 'ndh-api-pc'; Helm prefixes the release name, so the service is 'ndh-ndh-api-pc'.
  dnsNames:
  - ndh-api-pc
  - ndh-ndh-api-pc
  - ndh-ndh-api-pc.ndh-core
  - ndh-ndh-api-pc.ndh-core.svc
  - ndh-ndh-api-pc.ndh-core.svc.cluster.local
  usages:
  - server auth
  - client auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: msp-datalens
  namespace: ndh-core
spec:
  secretName: msp-cert-datalens
  issuerRef:
    kind: ClusterIssuer
    name: kommander-ca
  commonName: datalens
  # ndh-ndh-api and ndh-ui share cert_service_name 'datalens' (there is no service by that name), so
  # this one certificate is served on both of their services.
  dnsNames:
  - datalens
  - ndh-ndh-api
  - ndh-ndh-api.ndh-core
  - ndh-ndh-api.ndh-core.svc
  - ndh-ndh-api.ndh-core.svc.cluster.local
  - ndh-ui
  - ndh-ui.ndh-core
  - ndh-ui.ndh-core.svc
  - ndh-ui.ndh-core.svc.cluster.local
