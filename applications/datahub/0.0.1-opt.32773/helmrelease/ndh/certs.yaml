  - iam-proxy
  - iam-proxy.ndh-core
  - iam-proxy.ndh-core.svc
  - iam-proxy.ndh-core.svc.cluster.local
  - iam-proxy-admin
  - iam-proxy-admin.ndh-core
  - iam-proxy-admin.ndh-core.svc
  - iam-proxy-admin.ndh-core.svc.cluster.local
  - iam-proxy-cac
  - iam-proxy-cac.ndh-core
  - iam-proxy-cac.ndh-core.svc
  - iam-proxy-cac.ndh-core.svc.cluster.local
