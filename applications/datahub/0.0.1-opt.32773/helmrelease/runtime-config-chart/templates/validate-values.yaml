{{- $nutanix := .Values.nutanix | default dict -}}
{{- $cluster := $nutanix.cluster | default dict -}}
{{- $prismCentral := $nutanix.prismCentral | default dict -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: dl-runtime-config-validate
  annotations:
    # Run before ordinary resources so an incomplete UI configuration cannot
    # create an invalid PC proxy or empty mspdeployedparams ConfigMaps.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: validate
        image: alpine:3.20
        command: ["/bin/sh", "-ec"]
        args:
        - |
          missing=""
          [ -n "{{ default "" $prismCentral.ip }}" ] || missing="$missing nutanix.prismCentral.ip"
          [ -n "{{ default "" $prismCentral.uuid }}" ] || missing="$missing nutanix.prismCentral.uuid"
          [ -n "{{ default "" $cluster.name }}" ] || missing="$missing nutanix.cluster.name"
          [ -n "{{ default "" $cluster.uuid }}" ] || missing="$missing nutanix.cluster.uuid"
          if [ -n "$missing" ]; then
            echo "DataHub cannot start: enter these values in the NKP workspace configuration:$missing"
            exit 1
          fi
          echo "Required NKP workspace values are present."
