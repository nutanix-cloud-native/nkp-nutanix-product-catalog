{{- /*
The runtime chart is the last application-owned HelmRelease that can run a
Helm pre-delete hook.  The hook coordinates deletion of the other DataHub
HelmReleases and removes only resources labelled as application-owned.

It deliberately preserves:
  - namespaces data-lens and ndh-core
  - image-pull and Prism Central credential Secrets
  - ClickHouse and NKP-managed CRDs
  - PriorityClasses
  - NKP, MetalLB and other platform resources
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datahub-pre-delete-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datahub-pre-delete-cleanup
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources: ["helmreleases"]
  verbs: ["get", "list", "watch", "delete", "patch"]
- apiGroups: ["source.toolkit.fluxcd.io"]
  resources: ["helmcharts", "helmrepositories"]
  verbs: ["get", "list", "watch", "delete", "patch"]
- apiGroups: [""]
  resources:
  - configmaps
  - deployments
  - daemonsets
  - statefulsets
  - services
  - jobs
  - cronjobs
  - persistentvolumeclaims
  verbs: ["get", "list", "watch", "delete", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch", "delete", "patch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "delete", "patch"]
- apiGroups: ["clickhouse.altinity.com"]
  resources: ["clickhouseinstallations"]
  verbs: ["get", "list", "watch", "delete", "patch"]
- apiGroups: ["ray.io"]
  resources: ["rayclusters", "rayjobs", "rayservices"]
  verbs: ["get", "list", "watch", "delete", "patch"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificates", "certificaterequests"]
  verbs: ["get", "list", "watch", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datahub-pre-delete-cleanup
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datahub-pre-delete-cleanup
subjects:
- kind: ServiceAccount
  name: datahub-pre-delete-cleanup
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: datahub-pre-delete-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 540
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datahub-pre-delete-cleanup
        app.kubernetes.io/managed-by: Helm
    spec:
      restartPolicy: Never
      serviceAccountName: datahub-pre-delete-cleanup
      containers:
      - name: cleanup
        image: alpine/k8s:1.33.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-ec"]
        args:
        - |
          set -eu

          app_label_names="datahub-1-helmrelease datahub-helmrelease"
          helm_releases="datahub datahub-1 dl-common data-lens ndh"

          is_datahub_resource() {
            label="$(kubectl get "$1" "$2" -n "$3" \
              -o jsonpath='{.metadata.labels.kustomize\.toolkit\.fluxcd\.io/name}' \
              2>/dev/null || true)"
            case " $app_label_names " in
              *" $label "*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Start uninstall for the sibling HelmReleases while their chart
          # sources are still expected to be available.
          for release in $helm_releases; do
            if kubectl get helmrelease "$release" -n {{ .Release.Namespace }} \
              >/dev/null 2>&1; then
              if is_datahub_resource helmrelease "$release" {{ .Release.Namespace }}; then
                kubectl delete helmrelease "$release" -n {{ .Release.Namespace }} \
                  --wait=false --ignore-not-found || true
              fi
            fi
          done

          # Give Flux/Helm time to perform normal uninstalls first.
          for attempt in $(seq 1 120); do
            remaining=0
            for release in $helm_releases; do
              if kubectl get helmrelease "$release" -n {{ .Release.Namespace }} \
                >/dev/null 2>&1; then
                remaining=1
              fi
            done
            [ "$remaining" -eq 0 ] && break
            sleep 2
          done

          # If a DataHub HelmRelease is already terminating but its Flux
          # finalizer is blocked by a missing source, release that finalizer.
          # This is restricted to DataHub-labelled HelmReleases.
          for release in $helm_releases; do
            if kubectl get helmrelease "$release" -n {{ .Release.Namespace }} \
              >/dev/null 2>&1 && is_datahub_resource helmrelease "$release" {{ .Release.Namespace }}; then
              deleting="$(kubectl get helmrelease "$release" -n {{ .Release.Namespace }} \
                -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)"
              if [ -n "$deleting" ]; then
                kubectl patch helmrelease "$release" -n {{ .Release.Namespace }} \
                  --type=merge -p '{"metadata":{"finalizers":[]}}' || true
              fi
            fi
          done

          # Wait once more after releasing blocked Flux finalizers. This
          # prevents source objects from being removed while HelmReleases
          # still exist.
          for attempt in $(seq 1 60); do
            remaining=0
            for release in $helm_releases; do
              if kubectl get helmrelease "$release" -n {{ .Release.Namespace }} \
                >/dev/null 2>&1; then
                remaining=1
              fi
            done
            [ "$remaining" -eq 0 ] && break
            sleep 2
          done

          # HelmCharts are generated by source-controller from HelmReleases.
          # Remove only the charts belonging to this DataHub application,
          # after their HelmReleases are gone.
          for chart in kommander-datahub-1 kommander-dl-common \
                       kommander-data-lens kommander-ndh \
                       kommander-dl-runtime-config; do
            kubectl delete helmchart "$chart" -n {{ .Release.Namespace }} \
              --ignore-not-found --wait=false || true
          done

          # These repositories are application-specific. They are deliberately
          # retained from Kustomize pruning until this hook reaches this point.
          for repository in datahub-1-canaveral-helm \
                           datahub-1-canaveral-helm-backup; do
            kubectl delete helmrepository "$repository" -n {{ .Release.Namespace }} \
              --ignore-not-found --wait=false || true
          done

          # Remove application-owned resources that can remain after a
          # forced HelmRelease deletion.  Secrets are intentionally absent
          # from this list so manually-created credentials survive.
          for namespace in data-lens ndh-core; do
            for release in datahub datahub-1 dl-common data-lens ndh; do
              selector="app.kubernetes.io/managed-by=Helm,app.kubernetes.io/instance=$release"
              for resource in deployments daemonsets statefulsets services jobs cronjobs configmaps persistentvolumeclaims; do
                kubectl delete "$resource" -n "$namespace" -l "$selector" \
                  --ignore-not-found --wait=false || true
              done
              for resource in clickhouseinstallations rayclusters rayjobs rayservices; do
                objects="$(kubectl get "$resource" -n "$namespace" -l "$selector" \
                  -o name 2>/dev/null || true)"
                for object in $objects; do
                  kubectl patch "$object" -n "$namespace" --type=merge \
                    -p '{"metadata":{"finalizers":[]}}' || true
                  kubectl delete "$object" -n "$namespace" \
                    --ignore-not-found --wait=false || true
                done
              done
            done
          done

          # Remove cert-manager objects created by the application Kustomization.
          for label in $app_label_names; do
            for resource in certificates certificaterequests; do
              kubectl delete "$resource" -A \
                -l "kustomize.toolkit.fluxcd.io/name=$label" \
                --ignore-not-found --wait=false || true
            done
          done

          # Clean the runtime compatibility objects. Credentials,
          # namespaces and PriorityClasses are deliberately preserved.
          kubectl delete configmap mspdeployedparams dl-pc-proxy \
            -n data-lens --ignore-not-found --wait=false || true
          kubectl delete configmap mspdeployedparams \
            -n ndh-core --ignore-not-found --wait=false || true
          kubectl delete deployment dl-pc-proxy \
            -n data-lens --ignore-not-found --wait=false || true
          kubectl delete service dl-pc-proxy \
            -n data-lens --ignore-not-found --wait=false || true
          kubectl delete service iam-proxy \
            -n ntnx-base --ignore-not-found --wait=false || true

          for service in $(kubectl get service -n ntnx-ikat -o name 2>/dev/null \
            | grep '^service/pc-' || true); do
            kubectl delete "$service" -n ntnx-ikat \
              --ignore-not-found --wait=false || true
          done

          echo "DataHub pre-delete cleanup completed."
