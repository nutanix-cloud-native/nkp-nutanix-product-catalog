apiVersion: v1
kind: Namespace
metadata:
  name: ntnx-ikat-platform
---
apiVersion: v1
kind: Service
metadata:
  # The validation hook prevents this fallback during installation. It keeps
  # Helm uninstall possible if the UI override is removed first.
  name: pc-{{ default "unconfigured" .Values.nutanix.prismCentral.uuid }}
  namespace: ntnx-ikat-platform
spec:
  type: ExternalName
  externalName: dl-pc-proxy.data-lens.svc.cluster.local
---
apiVersion: v1
kind: Namespace
metadata:
  name: ntnx-base
---
apiVersion: v1
kind: Service
metadata:
  name: iam-proxy
  namespace: ntnx-base
spec:
  type: ExternalName
  externalName: dl-pc-proxy.data-lens.svc.cluster.local
