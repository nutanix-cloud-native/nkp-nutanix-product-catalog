# ConfigMap for NDH Operators default values
# Users MUST provide imagePullSecret.credentials when enabling from UI
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-operators-config
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    # Image pull credentials for Artifactory (REQUIRED)
    # Override these values when enabling NDH from the UI
    imagePullSecret:
      name: ndh-iep-secret
      credentials:
        registry: artifactory-edge-01.corp.p10y.ntnxdpro.com
        username: ""
        password: ""
---
# ConfigMap for NDH Core default values
# Users MUST provide imagePullSecret.credentials when enabling from UI
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-core-config
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    # Image pull credentials for Artifactory (REQUIRED)
    # Override these values when enabling NDH from the UI
    imagePullSecret:
      create: true
      name: ndh-iep-secret
      credentials:
        registry: artifactory-edge-01.corp.p10y.ntnxdpro.com
        username: ""
        password: ""
---
