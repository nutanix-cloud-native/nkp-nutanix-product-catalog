overview: |
  # NDH (Nutanix Data Hub)

  NDH is a comprehensive data platform for Kubernetes.

  ## Prerequisites (REQUIRED)

  Before enabling NDH, create the following secrets on the target cluster.

  ### Container Image Registry Secrets (Artifactory)

  Create in both application namespaces:

  ```bash
  # For NDH core components
  kubectl create namespace ndh-core
  kubectl create secret docker-registry ndh-image-pull-secret \
    --namespace=ndh-core \
    --docker-server=artifactory-edge-01.corp.p10y.ntnxdpro.com \
    --docker-username=<your-username> \
    --docker-password=<your-api-key>

  # For NDH operators
  kubectl create namespace ndh-operators
  kubectl create secret docker-registry ndh-image-pull-secret \
    --namespace=ndh-operators \
    --docker-server=artifactory-edge-01.corp.p10y.ntnxdpro.com \
    --docker-username=<your-username> \
    --docker-password=<your-api-key>
  ```

  ## Configuration

  When enabling NDH, reference the pre-created secret name:

  ```yaml
  imagePullSecrets:
    - name: ndh-image-pull-secret
  ```

  ## Resource Requirements

  NDH requires approximately 8 worker nodes with 4 CPU / 8GB RAM each.
