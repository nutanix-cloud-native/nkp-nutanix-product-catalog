# OCI Repository for the NDH operators
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-operators-chart
  namespace: ${releaseNamespace}
spec:
  interval: 10m
  ref:
    tag: 0.1.8
  url: "oci://ghcr.io/mirko38/ndh-operators"
---
# OCI Repository for the NDH core
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-core-chart
  namespace: ${releaseNamespace}
spec:
  interval: 10m
  ref:
    tag: 0.1.29
  url: "oci://ghcr.io/mirko38/ndh-core"
---
# Helm Release for the NDH operators
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${releaseName}-operators
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-operators-chart
    namespace: ${releaseNamespace}
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 30
  uninstall:
    disableHooks: false
    keepHistory: false
    deletionPropagation: foreground
    timeout: 5m
  interval: 15s
  targetNamespace: ${releaseNamespace}
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 30
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-operators-config
  - kind: ConfigMap
    name: ${releaseName}-config-overrides
    optional: true
  - kind: ConfigMap
    name: ${releaseName}-cluster-overrides
    optional: true
---
# Helm Release for the NDH core
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${releaseName}-core
  namespace: ${releaseNamespace}
spec:
  dependsOn:
    - name: ${releaseName}-operators
      namespace: ${releaseNamespace}
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-core-chart
    namespace: ${releaseNamespace}
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 30
  uninstall:
    disableHooks: false
    keepHistory: false
    deletionPropagation: foreground
    timeout: 10m
  interval: 15s
  targetNamespace: ${releaseNamespace}
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 30
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-core-config
  - kind: ConfigMap
    name: ${releaseName}-config-overrides
    optional: true
  - kind: ConfigMap
    name: ${releaseName}-cluster-overrides
    optional: true
---
