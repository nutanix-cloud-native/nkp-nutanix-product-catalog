---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${releaseName}-envoy-gateway
  namespace: ${workspaceNamespace}
spec:
  interval: 6h
  retryInterval: 1m
  path: ./helmrelease
  prune: true
  force: false
  wait: true
  dependsOn:
    - name: ${releaseName}-envoy-gateway-crds
  sourceRef:
    kind: OCIRepository
    name: ${releaseName}-source
    namespace: ${releaseNamespace}
  timeout: 10m
