---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-crds
  namespace: ${workspaceNamespace}
spec:
  interval: 6h
  retryInterval: 1m
  path: ./applications/envoy-gateway/1.5.0/crds
  prune: true
  force: true
  wait: true
  targetNamespace: envoy-gateway-system
  sourceRef:
    kind: GitRepository
    name: management
    namespace: kommander-flux
  timeout: 10m