---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${releaseName}-envoy-gateway-crds
  namespace: ${workspaceNamespace}
spec:
  interval: 6h
  retryInterval: 1m
  path: ./crds
  prune: false
  force: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: ${releaseName}-source
    namespace: ${releaseNamespace}
  timeout: 10m
