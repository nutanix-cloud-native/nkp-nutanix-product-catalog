---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-config-nai-defaults
  namespace: ${workspaceNamespace}
data:
  values.yaml: |-
    config:
      envoyGateway:
        gateway:
          controllerName: "gateway.envoyproxy.io/gatewayclass-controller"
        logging:
          level:
            default: "info"
        provider:
          kubernetes:
            rateLimitDeployment:
              container:
                image: "docker.io/envoyproxy/ratelimit:1e50889b"
              patch:
                type: "StrategicMerge"
                value:
                  spec:
                    template:
                      spec:
                        containers:
                          - imagePullPolicy: "IfNotPresent"
                            name: "envoy-ratelimit"
                            image: "docker.io/envoyproxy/ratelimit:1e50889b"
                            env:
                              - name: REDIS_TYPE
                                value: "sentinel"
                              - name: REDIS_PIPELINE_WINDOW
                                value: "150us"
          type: "Kubernetes"
        extensionApis:
          enableEnvoyPatchPolicy: true
          enableBackend: true
        extensionManager:
          maxMessageSize: 11Mi
          # Enable InferencePool custom resource support
          backendResources:
            - group: inference.networking.k8s.io
              kind: InferencePool
              version: v1
          hooks:
            xdsTranslator:
              translation:
                listener:
                  includeAll: true
                route:
                  includeAll: true
                cluster:
                  includeAll: true
                secret:
                  includeAll: true
              post:
                - "Translation"
                - "Cluster"
                - "Route"
          service:
            fqdn:
              hostname: "ai-gateway-controller.nai-system.svc.cluster.local"
              port: 1063
        rateLimit:
          backend:
            type: "Redis"
            redis:
              # Sentinel URL: "<masterSet>,<sentinel-host>:<port>". The rate limiter
              # discovers the current primary via Sentinel (REDIS_TYPE=sentinel set
              # on the container env above).
              url: "mymaster,nai-valkey-sentinel.nai-system.svc.cluster.local:26379"
