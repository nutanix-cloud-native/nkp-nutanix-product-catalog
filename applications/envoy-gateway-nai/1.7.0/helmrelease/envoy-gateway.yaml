---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-1.7.0-chart
  namespace: ${workspaceNamespace}
spec:
  url: oci://docker.io/envoyproxy/gateway-helm
  ref:
    tag: v1.7.0
  interval: 24h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-nai
  namespace: ${workspaceNamespace}
spec:
  interval: 15s
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-1.7.0-chart
    namespace: ${workspaceNamespace}
  install:
    crds: Skip
    remediation:
      retries: 30
    createNamespace: true
  upgrade:
    crds: Skip
    remediation:
      retries: 30
  releaseName: eg
  targetNamespace: envoy-gateway-system
  valuesFrom:
    - kind: ConfigMap
      name: ${releaseName}-config-nai-defaults
    - kind: ConfigMap
      name: ${releaseName}-config-overrides
      optional: true
    - kind: ConfigMap
      name: ${releaseName}-cluster-overrides
      optional: true
