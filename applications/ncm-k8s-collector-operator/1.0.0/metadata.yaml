displayName: NCM K8s Collector Operator
description: Unified Multi-Cluster Telemetry Operator. Reconciles telemetry.platform/v1 TelemetryIntent custom resources into merged OpenTelemetry Collector configs and deploys a single collector per workspace across the management and all attached workload clusters.
