name: E2E Tests

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  detect-changed-apps:
    uses: ./.github/workflows/detect-changed-apps.yaml

  build-app-bundle:
    needs: detect-changed-apps
    name: Build bundle ${{ matrix.app }} ${{ matrix.version }}
    if: ${{ needs.detect-changed-apps.outputs.apps_count != '0' }}
    runs-on: self-hosted-nutanix-medium
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changed-apps.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install NIX
        uses: cachix/install-nix-action@v31

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: true
          skip-nix-installation: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.NUTANIX_DOCKERHUB_USERNAME }}
          password: ${{ secrets.NUTANIX_DOCKERHUB_PASSWORD }}

      - name: Build application bundle
        env:
          APP_NAME: ${{ matrix.app }}
          APP_VERSION: ${{ matrix.version }}
        run: |
          echo "Building full bundle for ${APP_NAME} ${APP_VERSION}"
          devbox run -- just create-application-full-bundle "${APP_NAME}" "${APP_VERSION}"
